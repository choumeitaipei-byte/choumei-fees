<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>洲美扶輪社 — 社友帳務總表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002147;
    --navy-mid: #003366;
    --gold: #C9A84C;
    --cream: #faf7f2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }
  body { background: var(--cream); min-height: 100vh; padding: 20px 16px 60px; color: #1a1a2e; }
  .mono { font-family: 'DM Mono', monospace; }

  .header { text-align: center; padding: 12px 0 24px; }
  .header-badge { background: var(--navy); color: var(--gold); padding: 4px 16px; border-radius: 99px; font-size: 11px; font-weight: 900; letter-spacing: 0.15em; display: inline-block; margin-bottom: 10px; }
  .header-title { font-size: 15px; color: #888; font-weight: 500; }

  .wrap { max-width: 1100px; margin: 0 auto; }

  .month-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .month-badge { background: rgba(201,168,76,0.15); border: 1.5px solid var(--gold); color: var(--navy); padding: 5px 18px; border-radius: 99px; font-size: 13px; font-weight: 900; }
  .refresh-btn { background: white; border: 1.5px solid #e8e4da; border-radius: 99px; padding: 5px 16px; font-size: 12px; font-weight: 700; color: var(--navy-mid); cursor: pointer; }
  .refresh-btn:active { background: #f5f2ec; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: white; border-radius: 16px; padding: 16px 18px; box-shadow: 0 2px 12px rgba(0,33,71,0.06); }
  .stat-label { font-size: 11px; color: #999; font-weight: 700; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 900; color: var(--navy); }
  .stat-value.due { color: #dc2626; }
  .stat-value.ok { color: #16a34a; }

  .table-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,33,71,0.06); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 720px; }
  thead th { background: #f5f2ec; padding: 12px 14px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #6b6358; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  thead th:first-child { text-align: left; }
  tbody td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f0ece4; white-space: nowrap; text-align: right; }
  tbody td:first-child { text-align: left; }
  tbody tr:hover { background: #faf8f4; }
  tbody tr.on-leave { opacity: 0.55; }
  .name-cell { font-weight: 700; }
  .nick-cell { font-size: 11px; color: #bbb; margin-top: 2px; }
  .badge-due { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 3px 12px; border-radius: 99px; font-size: 12px; font-weight: 900; }
  .badge-ok  { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; padding: 3px 12px; border-radius: 99px; font-size: 12px; font-weight: 900; }
  .badge-leave { background: #fef3cd; color: #b45309; border: 1px solid #f59e0b; padding: 1px 8px; border-radius: 99px; font-size: 10px; font-weight: 900; margin-left: 6px; }
  tfoot td { padding: 12px 14px; font-size: 13px; font-weight: 900; background: var(--navy); color: var(--gold); text-align: right; }
  tfoot td:first-child { text-align: left; }

  .note { text-align: center; font-size: 11px; color: #aaa; margin-top: 18px; line-height: 1.8; }

  .error-box { max-width: 480px; margin: 60px auto; text-align: center; }
  .error-icon { font-size: 48px; margin-bottom: 16px; }
  .error-msg { font-size: 16px; font-weight: 700; color: #555; }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">CHOU MEI ROTARY</div>
  <div class="header-title">洲美扶輪社 · 社友帳務總表（唯讀）</div>
</div>

<div class="wrap" id="content">
  <div class="error-box">
    <div class="error-icon">🔄</div>
    <div class="error-msg">載入中...</div>
  </div>
</div>

<script>
function getV(x) { return isNaN(Number(x)) ? 0 : Number(x); }

function sortByNickname(a, b) {
  const na = (a.nickname || a.name || '').trim().toUpperCase();
  const nb = (b.nickname || b.name || '').trim().toUpperCase();
  if (na < nb) return -1;
  if (na > nb) return 1;
  return 0;
}

function calcFees(m) {
  const v = getV;
  const vr = (m?.variable && !Array.isArray(m.variable)) ? m.variable : {};
  const sumA = v(m?.fixedA?.monthly) + (vr.fixedA_list||[]).reduce((a,i)=>a+v(i.amount),0);
  const sumB = v(m?.fixedB?.monthly_split)
    + (vr.service_list||[]).reduce((a,i)=>a+v(i.amount),0)
    + (vr.donation_fixed_list||[]).reduce((a,i)=>a+v(i.amount),0)
    + (vr.donation_general_list||[]).reduce((a,i)=>a+v(i.amount),0)
    + (vr.donation_list||[]).reduce((a,i)=>a+v(i.amount),0);
  const sumC = (vr.advance_pay_list||[]).reduce((a,i)=>a+v(i.amount),0);
  const sumD = sumA + sumB + sumC;
  const sumE = v(m?.accounting?.previous_due);
  const sumF = (vr.receipt_list||[]).filter(i=>i.type!=='receipt_card').reduce((a,i)=>a+v(i.amount),0);
  const sumG = (vr.receipt_list||[]).filter(i=>i.type==='receipt_card').reduce((a,i)=>a+v(i.amount),0)
    + (vr.credit_card_list||[]).reduce((a,i)=>a+v(i.amount),0)
    + v(m?.accounting?.credit_card);
  const H = sumD + sumE - sumF - sumG;
  return { sumA, sumB, sumC, sumD, sumE, sumF, sumG, finalH: H };
}

function money(n) {
  const v = getV(n);
  return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString();
}

function dedupeMembers(members) {
  const seen = {};
  const deduped = [];
  [...members].reverse().forEach(m => {
    if (m && m.id && !seen[m.id]) { seen[m.id] = true; deduped.push(m); }
  });
  return deduped.reverse();
}

function render(members, settings) {
  members = dedupeMembers(members);
  const sorted = [...members].sort(sortByNickname);
  let totalA=0, totalB=0, totalC=0, totalD=0, totalE=0, totalPaid=0, totalH=0;

  const rows = sorted.map(m => {
    const f = calcFees(m);
    totalA += f.sumA; totalB += f.sumB; totalC += f.sumC; totalD += f.sumD;
    totalE += f.sumE; totalPaid += (f.sumF + f.sumG); totalH += f.finalH;
    const badge = f.finalH > 0
      ? `<span class="badge-due">${money(f.finalH)}</span>`
      : `<span class="badge-ok">${money(f.finalH)}</span>`;
    return `<tr class="${m.onLeave ? 'on-leave' : ''}">
      <td>
        <div class="name-cell">${m.name}${m.onLeave ? '<span class="badge-leave">請假</span>' : ''}</div>
        <div class="nick-cell">${m.nickname || ''}</div>
      </td>
      <td class="mono">${money(f.sumA)}</td>
      <td class="mono">${money(f.sumB)}</td>
      <td class="mono" style="color:#7c3aed">${money(f.sumC)}</td>
      <td class="mono" style="font-weight:700;color:var(--navy)">${money(f.sumD)}</td>
      <td class="mono" style="color:#888">${money(f.sumE)}</td>
      <td class="mono" style="color:#16a34a">${money(f.sumF + f.sumG)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');

  const dueCount = sorted.filter(m => calcFees(m).finalH > 0).length;

  document.getElementById('content').innerHTML = `
    <div class="month-bar">
      <div class="month-badge">${settings.currentMonth || ''}</div>
      <button class="refresh-btn" onclick="location.reload()">↻ 重新整理</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">社友人數</div>
        <div class="stat-value">${sorted.length} 位</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本期社費總額 (D)</div>
        <div class="stat-value mono">${money(totalD)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已收金額 (F+G)</div>
        <div class="stat-value mono ok">${money(totalPaid)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">未收總額 (H)</div>
        <div class="stat-value mono ${totalH>0?'due':'ok'}">${money(totalH)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">尚有欠款社友</div>
        <div class="stat-value ${dueCount>0?'due':'ok'}">${dueCount} 位</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>社友姓名</th>
              <th>經常費(A)</th>
              <th>服務費(B)</th>
              <th>代付款(C)</th>
              <th>本期社費(D)</th>
              <th>前期(E)</th>
              <th>已收(F+G)</th>
              <th>未付款(H)</th>
            </tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="8" style="text-align:center;padding:40px;color:#bbb">尚無社友資料</td></tr>'}</tbody>
          <tfoot>
            <tr>
              <td>合計</td>
              <td class="mono">${money(totalA)}</td>
              <td class="mono">${money(totalB)}</td>
              <td class="mono">${money(totalC)}</td>
              <td class="mono">${money(totalD)}</td>
              <td class="mono">${money(totalE)}</td>
              <td class="mono">${money(totalPaid)}</td>
              <td class="mono">${money(totalH)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="note">
      財務聯絡：${settings.financialContact?.name || ''} ${settings.financialContact?.phone || ''}<br>
      此頁面為唯讀總表，資料每次開啟會自動從雲端取得最新資料，無法在此頁面進行修改。
    </div>
  `;
}

function showError(msg) {
  document.getElementById('content').innerHTML = `
    <div class="error-box">
      <div class="error-icon">⚠️</div>
      <div class="error-msg">無法載入資料<br><small style="font-size:12px;color:#aaa;margin-top:8px;display:block">${msg}</small></div>
    </div>`;
}

function init() {
  const params = new URLSearchParams(location.search);
  const apiUrlFromParam = params.get('api');
  if (apiUrlFromParam) {
    localStorage.setItem('choumei_api_url', apiUrlFromParam);
  }
  const apiUrl = apiUrlFromParam || localStorage.getItem('choumei_api_url');

  if (!apiUrl) {
    showError('這個連結缺少 API 網址參數，請確認連結是否完整（需包含 ?api=...）。');
    return;
  }

  fetch(apiUrl + '?action=getAll')
    .then(r => r.json())
    .then(data => {
      if (!data.ok) throw new Error(data.error || '讀取失敗');
      render(data.members || [], data.settings || {});
    })
    .catch(err => showError(err.message));
}

init();
</script>
</body>
</html>
